<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}ProfileRewrite — AI-Powered LinkedIn Optimizer{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary":                  "#002b5a",
            "primary-container":        "#004182",
            "on-primary":               "#ffffff",
            "on-primary-container":     "#84aff7",
            "primary-fixed":            "#d6e3ff",
            "on-primary-fixed":         "#001b3d",
            "on-primary-fixed-variant": "#0c4687",
            "secondary":                "#006c4a",
            "secondary-container":      "#82f5c1",
            "on-secondary":             "#ffffff",
            "on-secondary-container":   "#00714e",
            "secondary-fixed":          "#85f8c4",
            "tertiary":                 "#1d2d41",
            "tertiary-fixed":           "#d3e4fe",
            "surface":                  "#f7f9fb",
            "surface-container-lowest": "#ffffff",
            "surface-container-low":    "#f2f4f6",
            "surface-container":        "#eceef0",
            "surface-container-high":   "#e6e8ea",
            "surface-container-highest":"#e0e3e5",
            "on-surface":               "#191c1e",
            "on-surface-variant":       "#424750",
            "outline":                  "#737781",
            "outline-variant":          "#c3c6d2",
            "error":                    "#ba1a1a",
            "background":               "#f7f9fb",
          },
          fontFamily: { sans: ["Inter", "sans-serif"] },
          fontSize: {
            "h1":         ["40px",  { lineHeight:"1.2", letterSpacing:"-0.02em", fontWeight:"700" }],
            "h2":         ["30px",  { lineHeight:"1.3", letterSpacing:"-0.01em", fontWeight:"600" }],
            "h3":         ["24px",  { lineHeight:"1.4", letterSpacing:"0",       fontWeight:"600" }],
            "body-lg":    ["18px",  { lineHeight:"1.6", fontWeight:"400" }],
            "body-md":    ["16px",  { lineHeight:"1.5", fontWeight:"400" }],
            "body-sm":    ["14px",  { lineHeight:"1.5", fontWeight:"400" }],
            "label-caps": ["12px",  { lineHeight:"1.2", letterSpacing:"0.05em", fontWeight:"600" }],
            "btn":        ["15px",  { lineHeight:"1",   letterSpacing:"0.01em", fontWeight:"500" }],
          },
          borderRadius: {
            DEFAULT:"0.25rem", sm:"0.125rem", md:"0.375rem",
            lg:"0.5rem", xl:"0.75rem", "2xl":"1rem", full:"9999px",
          },
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
      display:inline-block; vertical-align:middle; line-height:1;
    }
    /* Dark mode */
    html.dark body { background:#0f172a; color:#f1f5f9; }
    html.dark .bg-white,
    html.dark .bg-surface-container-lowest,
    html.dark .bg-surface,
    html.dark .bg-background { background:#1e293b !important; }
    html.dark .bg-surface-container-low,
    html.dark .bg-surface-container { background:#243044 !important; }
    html.dark .bg-surface-container-high,
    html.dark .bg-surface-container-highest { background:#2d3a4f !important; }
    html.dark .bg-primary-fixed   { background:#1e3a5f !important; }
    html.dark .bg-secondary-container { background:#003d2a !important; }
    html.dark .bg-secondary-fixed { background:#004d35 !important; }
    html.dark .text-on-surface    { color:#f1f5f9 !important; }
    html.dark .text-on-surface-variant { color:#94a3b8 !important; }
    html.dark .text-primary       { color:#84aff7 !important; }
    html.dark .text-on-primary-fixed-variant { color:#84aff7 !important; }
    html.dark .text-on-secondary-container   { color:#68dba9 !important; }
    html.dark .text-outline       { color:#64748b !important; }
    html.dark .border-outline-variant { border-color:#334155 !important; }
    html.dark .divide-outline-variant > * + * { border-color:#334155 !important; }
    html.dark input, html.dark textarea, html.dark select {
      background:#0f172a !important; color:#f1f5f9 !important; border-color:#334155 !important;
    }
    html.dark input::placeholder, html.dark textarea::placeholder { color:#475569 !important; }
    /* Focus ring */
    input:focus, textarea:focus, select:focus {
      outline:none; border-color:#004182 !important;
      box-shadow:0 0 0 3px rgba(0,65,130,0.15);
    }
    /* iOS zoom prevention */
    input, textarea, select { font-size:16px !important; }
  </style>
  <script>(function(){var t=localStorage.getItem('theme');if(t==='dark'){document.documentElement.classList.add('dark');}})();</script>
</head>
<body class="font-sans text-on-surface bg-background min-h-screen antialiased">

  <!-- Nav -->
  <header class="bg-white/95 dark:bg-slate-950/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <nav class="flex items-center justify-between px-4 sm:px-8 h-16 max-w-screen-xl mx-auto">
      <a href="/" class="text-xl font-bold text-primary-container tracking-tighter">ProfileRewrite</a>
      <div class="hidden md:flex items-center gap-8 text-sm font-medium">
        <a href="/" class="text-slate-600 hover:text-primary-container transition-colors">Home</a>
        <a href="/#how-it-works" class="text-slate-600 hover:text-primary-container transition-colors">How it Works</a>
        <a href="/optimize" class="text-slate-600 hover:text-primary-container transition-colors">Optimize</a>
      </div>
      <div class="flex items-center gap-2 sm:gap-3">
        <button id="dark-toggle" onclick="toggleDark()"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-outline-variant text-outline hover:border-primary-container hover:text-primary-container transition-all text-label-caps">
          <span id="dark-icon" class="material-symbols-outlined" style="font-size:16px">dark_mode</span>
          <span id="dark-label" class="hidden sm:inline">Dark</span>
        </button>
        <a href="/optimize" class="bg-secondary text-on-secondary px-4 sm:px-6 py-2.5 rounded-lg text-btn font-medium hover:opacity-90 active:opacity-80 transition-opacity">
          Optimize Profile
        </a>
      </div>
    </nav>
  </header>

  <main class="{% block container_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-slate-50 border-t border-slate-200 mt-24">
    <div class="flex flex-col md:flex-row justify-between items-center px-8 py-12 gap-6 max-w-screen-xl mx-auto">
      <div class="flex flex-col items-center md:items-start gap-1">
        <span class="font-bold text-slate-900 text-lg">ProfileRewrite</span>
        <p class="text-xs text-slate-500">© 2025 ProfileRewrite. The professional standard for career advancement.</p>
      </div>
      <div class="flex flex-wrap justify-center gap-6 text-xs text-slate-500">
        <a href="#" class="hover:text-slate-800 transition-colors">Privacy Policy</a>
        <a href="#" class="hover:text-slate-800 transition-colors">Terms of Service</a>
        <a href="#" class="hover:text-slate-800 transition-colors">Help Center</a>
      </div>
    </div>
  </footer>

  <script>
    function toggleDark(){var d=document.documentElement.classList.toggle('dark');localStorage.setItem('theme',d?'dark':'light');updateToggle(d);}
    function updateToggle(d){document.getElementById('dark-icon').textContent=d?'light_mode':'dark_mode';document.getElementById('dark-label').textContent=d?'Light':'Dark';}
    updateToggle(document.documentElement.classList.contains('dark'));
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
