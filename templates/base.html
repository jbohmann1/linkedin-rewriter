<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}LinkedIn Profile Rewriter{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .btn-primary {
      background: #0A66C2; color: #fff;
      padding: 12px 28px; border-radius: 24px;
      font-weight: 600; font-size: 15px;
      border: none; cursor: pointer;
      transition: background .15s;
      display: inline-block; text-align: center;
    }
    .btn-primary:hover { background: #004182; }
    .btn-primary:disabled { background: #8fb8e0; cursor: not-allowed; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; }
    .tag { display: inline-block; background: #EFF6FF; color: #1D4ED8;
           font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Nav -->
  <nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between">
    <a href="/" class="font-semibold text-gray-900 text-lg">✍️ ProfileRewrite</a>
    <span class="text-sm text-gray-500">AI-powered · Instant · $7</span>
  </nav>

  <main class="max-w-2xl mx-auto px-4 py-10">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-xs text-gray-400 py-8">
    ProfileRewrite is an AI tool — not a career counsellor or recruiter. Results may vary.
    <br>© 2025 ProfileRewrite · <a href="/privacy" class="underline">Privacy</a>
  </footer>

</body>
</html>
